<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin — Pesquisas | E.E. Prof. Manoel Rufino</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>Painel <span>do Administrador</span></h1>
    <p>Resultados das pesquisas em porcentagens</p>
  </header>
  <main>
    <div id="login" class="card" style="display:none">
      <h2>Acesso restrito</h2>
      <input type="text" id="username" placeholder="Usuário" autocomplete="username">
      <input type="password" id="password" placeholder="Senha" autocomplete="current-password">
      <p class="error" id="loginError"></p>
      <button id="btnLogin">Entrar</button>
    </div>

    <div id="dash" style="display:none">
      <div class="card toolbar">
        <strong id="total">0 respostas</strong><span id="live" class="live-dot" title="Atualização automática ativa"></span><small class="muted">tempo real</small>
        <span class="spacer"></span>
        <button id="btnRefresh" class="secondary">Atualizar</button>
        <button id="btnExport" class="secondary">Exportar CSV</button>
        <button id="btnSync" class="secondary">Sincronizar perguntas</button>
        <button id="btnReset" class="danger">Apagar respostas</button>
        <button id="btnLogout" class="secondary">Sair</button>
      </div>
      <div id="tabs" class="card toolbar"></div>
      <div id="results"></div>
    </div>
  </main>
  <footer><a href="/">Voltar às pesquisas</a></footer>

  <script>
    const letters = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];
    let charts = {};
    let cardIds = [];
    let lastSig = null;
    let pollTimer = null;
    let dashOn = false;
    let surveys = [];
    let currentSlug = null;

    function setLive(on) {
      const el = document.getElementById('live');
      if (el) el.classList.toggle('on', on);
    }

    async function checkLogin() {
      const res = await fetch('/api/admin/me');
      const data = await res.json();
      if (data.loggedIn) showDash();
      else {
        document.getElementById('login').style.display = 'block';
        document.getElementById('dash').style.display = 'none';
      }
    }

    document.getElementById('btnLogin').addEventListener('click', async () => {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      if (res.ok) { document.getElementById('password').value = ''; showDash(); }
      else document.getElementById('loginError').textContent = 'Usuário ou senha inválidos.';
    });
    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('btnLogin').click();
    });
    document.getElementById('username').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('btnLogin').click();
    });

    async function showDash() {
      document.getElementById('login').style.display = 'none';
      document.getElementById('dash').style.display = 'block';
      dashOn = true;
      const r = await fetch('/api/surveys');
      surveys = await r.json();
      if (!currentSlug && surveys.length) currentSlug = surveys[0].slug;
      renderTabs();
      await loadResults(true);
      if (!pollTimer) {
        pollTimer = setInterval(() => {
          if (dashOn && !document.hidden) loadResults(false);
        }, 4000);
      }
    }

    function renderTabs() {
      const box = document.getElementById('tabs');
      box.innerHTML = '';
      surveys.forEach((s, i) => {
        const b = document.createElement('button');
        b.className = s.slug === currentSlug ? '' : 'secondary';
        b.textContent = `${i + 1}. ${s.title}`;
        b.addEventListener('click', () => {
          if (currentSlug === s.slug) return;
          currentSlug = s.slug;
          lastSig = null;
          renderTabs();
          loadResults(true);
        });
        box.appendChild(b);
      });
    }

    function sigOf(data) {
      return data.totalResponses + '|' + data.questions.map(q =>
        q.qtype === 'text' ? ('T' + (q.groups || []).map(g => g.value + ':' + g.votes).join('~')) : q.votes.join(',')
      ).join(';');
    }

    async function loadResults(force) {
      let res;
      try {
        res = await fetch('/api/admin/results?survey=' + encodeURIComponent(currentSlug));
      } catch (e) { setLive(false); return; }
      if (res.status === 401) {
        dashOn = false;
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        checkLogin();
        return;
      }
      const data = await res.json();
      setLive(true);
      document.getElementById('total').textContent =
        `${data.totalResponses} resposta(s) no total`;
      const sig = sigOf(data);
      if (!force && sig === lastSig) return;
      lastSig = sig;
      renderResults(data);
    }

    function badgeData(q) {
      if (q.qtype === 'text') return { cls: 'info', text: 'Dissertativa' };
      if (q.correct === null || q.correct === undefined) return { cls: 'info', text: 'Opinião' };
      return { cls: q.correctRate >= 50 ? 'good' : 'warn', text: `Acertos: ${q.correctRate}%` };
    }

    function barColors(q) {
      if (q.qtype === 'multiple' || q.correct === null || q.correct === undefined) {
        let top = 0;
        q.votes.forEach((v, i) => { if (v > q.votes[top]) top = i; });
        return {
          colors: q.votes.map((_, i) => i === top ? '#f2b705' : '#55575c'),
          legend: '<span style="color:#f2b705">■</span> alternativa mais votada <span style="color:#55575c">■</span> demais'
        };
      }
      return {
        colors: q.votes.map((_, i) => i === q.correct ? '#2e9e5b' : '#55575c'),
        legend: '<span style="color:#2e9e5b">■</span> resposta correta <span style="color:#55575c">■</span> demais alternativas'
      };
    }

    function chartDataFor(q) {
      if (q.qtype === 'text') {
        const top = (q.groups || []).slice(0, 10);
        return {
          labels: top.map(g => String(g.value).slice(0, 22)),
          data: top.map(g => g.pct),
          colors: top.map((_, i) => i === 0 ? '#f2b705' : '#55575c')
        };
      }
      const bc = barColors(q);
      return { labels: q.options.map((_, j) => letters[j]), data: q.percentages, colors: bc.colors };
    }
    function chartOpts() {
      return {
        animation: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { max: 100, ticks: { color: '#b9aeb9', callback: v => v + '%' }, grid: { color: '#3a333a' } },
          x: { ticks: { color: '#f5f0f0' }, grid: { display: false } }
        }
      };
    }
    function rowsFor(q) {
      return q.options.map((opt, j) => {
        const mark = (q.correct === j) ? ' <span class="correct-opt">✓</span>' : '';
        return `<div class="result-row"><span><b>${letters[j]}</b>) ${opt}${mark}</span><span><b>${q.percentages[j]}%</b> <span class="muted">(${q.votes[j]})</span></span></div>`;
      }).join('');
    }

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function renderResults(data) {
      const box = document.getElementById('results');
      if (data.totalResponses === 0) {
        Object.values(charts).forEach(c => c.destroy());
        charts = {};
        cardIds = [];
        box.innerHTML = '<div class="card center muted">Ainda não há respostas.</div>';
        return;
      }
      const ids = data.questions.map(q => q.id).join(',');
      if (ids !== cardIds.join(',')) {
        Object.values(charts).forEach(c => c.destroy());
        charts = {};
        cardIds = data.questions.map(q => q.id);
        box.innerHTML = '';
        data.questions.forEach((q, i) => {
          const b = badgeData(q);
          const div = document.createElement('div');
          div.className = 'card';
          if (q.qtype === 'text') {
            div.innerHTML = `<p class="q-title"><span class="num">${i + 1}</span>${esc(q.text)}<span class="badge ${b.cls}">${b.text}</span></p>
              <canvas id="chart${q.id}"></canvas><div class="chart-legend"><span style="color:#f2b705">■</span> valor mais respondido</div>
              <div id="texts${q.id}">${textsFor(q)}</div>`;
          } else {
            const bc = barColors(q);
            div.innerHTML = `<p class="q-title"><span class="num">${i + 1}</span>${esc(q.text)}<span id="badge${q.id}" class="badge ${b.cls}">${b.text}</span></p>
              <canvas id="chart${q.id}"></canvas><div id="legend${q.id}" class="chart-legend">${bc.legend}</div><div id="rows${q.id}">${rowsFor(q)}</div>`;
          }
          box.appendChild(div);
          const gcd = chartDataFor(q);
          charts[q.id] = new Chart(document.getElementById('chart' + q.id), {
            type: 'bar',
            data: { labels: gcd.labels, datasets: [{ data: gcd.data, backgroundColor: gcd.colors }] },
            options: chartOpts()
          });
        });
      } else {
        data.questions.forEach((q) => {
          if (q.qtype === 'text') {
            const t = document.getElementById('texts' + q.id);
            if (t) t.innerHTML = textsFor(q);
            const gcd = chartDataFor(q);
            const tc = charts[q.id];
            if (tc) { tc.data.labels = gcd.labels; tc.data.datasets[0].data = gcd.data; tc.data.datasets[0].backgroundColor = gcd.colors; tc.update('none'); }
            return;
          }
          const b = badgeData(q);
          const badge = document.getElementById('badge' + q.id);
          if (badge) { badge.className = 'badge ' + b.cls; badge.textContent = b.text; }
          const rows = document.getElementById('rows' + q.id);
          if (rows) rows.innerHTML = rowsFor(q);
          const bc = barColors(q);
          const lg = document.getElementById('legend' + q.id);
          if (lg) lg.innerHTML = bc.legend;
          const c = charts[q.id];
          if (c) { c.data.datasets[0].data = q.percentages; c.data.datasets[0].backgroundColor = bc.colors; c.update('none'); }
        });
      }
    }

    function textsFor(q) {
      return `<p class="muted">${q.total} resposta(s) · ${(q.groups || []).length} valor(es) distinto(s)</p>`;
    }

    document.getElementById('btnRefresh').addEventListener('click', () => loadResults(true));
    document.getElementById('btnSync').addEventListener('click', async () => {
      if (!confirm('Atualizar as perguntas desta pesquisa a partir do arquivo?')) return;
      const res = await fetch('/api/admin/sync-questions?survey=' + encodeURIComponent(currentSlug), { method: 'POST' });
      const data = await res.json();
      alert(data.message || data.error || 'Erro.');
      if (res.ok) loadResults(true);
    });
    document.getElementById('btnLogout').addEventListener('click', async () => {
      await fetch('/api/admin/logout', { method: 'POST' });
      location.reload();
    });
    document.getElementById('btnExport').addEventListener('click', () => {
      window.location = '/api/admin/export?survey=' + encodeURIComponent(currentSlug);
    });
    document.getElementById('btnReset').addEventListener('click', async () => {
      const s = surveys.find(x => x.slug === currentSlug);
      const password = prompt(`Apagar TODAS as respostas de "${s ? s.title : currentSlug}"? Digite a senha de exclusão:`);
      if (!password) return;
      const res = await fetch('/api/admin/reset?survey=' + encodeURIComponent(currentSlug), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });
      if (res.status === 403) { alert('Senha de exclusão incorreta.'); return; }
      loadResults(true);
    });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && dashOn) loadResults(false);
    });

    checkLogin();
  </script>
</body>
</html>
